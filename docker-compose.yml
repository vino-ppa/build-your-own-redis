services:
  server:
    build: ./server
    ports:
      - "6380:6380" # RESP protocol (redis-cli -p 6380)
      - "6381:6381" # admin HTTP + WebSocket (used by the dashboard)
    volumes:
      - data:/app/data
    environment:
      SNAPSHOT_PATH: /app/data/dump.json

  web:
    build: ./web
    ports:
      - "8080:80" # dashboard: http://localhost:8080
    depends_on:
      - server

volumes:
  data:
